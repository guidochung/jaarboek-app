# Bij elke push: doe na wat Streamlit Community Cloud doet (Debian 13 + Python 3.14, zoals in hun build-log, packages.txt, requirements.txt,
# niet-root gebruiker) en controleer dat Chromium een PDF maakt en de app start.
name: Controle Streamlit Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  rooktest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Debian zoals Streamlit Community Cloud
        run: |
          docker run --rm -v "$PWD:/app" -w /app python:3.14-slim-trixie bash -euc '
            apt-get update -qq
            xargs -a packages.txt apt-get install -y -qq --no-install-recommends > /dev/null
            pip install -q --only-binary=:all: -r requirements.txt   # niets compileren (zoals pandas uit bron)
            python --version
            chromium --version
            useradd -m appuser
            su appuser -c "cd /app && python deploy/rooktest.py && python deploy/start_app.py"
          '

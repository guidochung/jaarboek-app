[server]
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
primaryColor = "#2457d6"
font = "-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
headingFont = "-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
headingFontWeights = [700, 650, 600, 600, 600, 600]
baseRadius = "0.6rem"
buttonRadius = "0.6rem"
showWidgetBorder = true
showSidebarBorder = true
metricValueFontSize = "1.55rem"
metricValueFontWeight = 650

[theme.light]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f6fa"
textColor = "#1c2333"
borderColor = "#e2e7ef"

[theme.light.sidebar]
backgroundColor = "#f7f9fc"
secondaryBackgroundColor = "#ffffff"

[theme.dark]
primaryColor = "#3466e6"
backgroundColor = "#0f1420"
secondaryBackgroundColor = "#182031"
textColor = "#e6e9ef"
borderColor = "#263047"

[theme.dark.sidebar]
backgroundColor = "#121928"
secondaryBackgroundColor = "#1a2335"
